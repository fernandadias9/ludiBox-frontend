<div class="flex flex-col items-center justify-center text-center p-6">
    <h2 class="text-xl font-bold mb-4 text-gray-800">
      Escaneie o QR Code com seu app autenticador
    </h2>
  
    <div *ngIf="qrCodeUrl; else carregando" class="border p-4 rounded-xl shadow-md bg-white">
      <img [src]="qrCodeUrl" alt="QR Code" class="w-48 h-48 mx-auto mb-4" />
      <p class="text-sm text-gray-600">
        Use Google Authenticator, Authy ou similar
      </p>
    </div>
  
    <ng-template #carregando>
      <div class="flex flex-col items-center justify-center gap-3">
        <div class="w-12 h-12 border-4 border-dashed rounded-full border-blue-500 animate-spin"></div>
        <p class="text-gray-500 text-sm">Carregando QR Code...</p>
      </div>
    </ng-template>
  </div>
