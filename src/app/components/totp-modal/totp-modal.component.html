<div class="max-w-md mx-auto p-8 bg-white rounded-xl shadow-lg border border-gray-100">
  <div class="text-center mb-8">
    <div class="w-16 h-16 bg-orange-100 rounded-full flex items-center justify-center mx-auto mb-4">
      <svg class="w-8 h-8 text-orange-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
      </svg>
    </div>
    
    <h2 class="text-2xl font-bold text-gray-900 mb-2">
      Autenticação em duas etapas
    </h2>

    <p class="text-gray-600 leading-relaxed">
      Digite o código de 6 dígitos gerado pelo seu aplicativo autenticador.
    </p>
  </div>

  <div class="mb-8">
    <label class="block text-sm font-medium text-gray-700 mb-3 text-center">
      Código de verificação
    </label>
    
    <div class="flex justify-center">
      <input
        [(ngModel)]="totpCode"
        maxlength="6"
        inputmode="numeric"
        class="text-center text-2xl font-mono border-2 border-gray-200 rounded-lg px-6 py-4 w-48 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-orange-300 focus:border-orange-300 focus:bg-white transition-all duration-200 placeholder-gray-400"
        placeholder="000 000"
        autofocus
      />
    </div>
  </div>

  <div class="flex flex-col sm:flex-row gap-3">
    <button
      (click)="confirmar()"
      class="flex-1 bg-primary hover:bg-orangeHover text-white font-semibold px-6 py-3 rounded-lg transition-all duration-200 transform hover:scale-[1.02] focus:outline-none focus:ring-2 focus:ring-orange-500 focus:ring-offset-2 shadow-sm">
      Confirmar
    </button>
    
    <button
      (click)="cancelar()"
      class="flex-1 bg-white hover:bg-gray-50 text-gray-700 font-semibold px-6 py-3 rounded-lg border-2 border-gray-200 hover:border-gray-300 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2">
      Cancelar
    </button>
  </div>
</div>
