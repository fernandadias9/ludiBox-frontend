<div class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50">
  <div class="bg-white rounded-xl p-6 shadow-lg w-full max-w-lg">
    <h2 class="text-center font-bold text-lg mb-6">Motivo da denúncia</h2>

    <form class="space-y-4" (submit)="$event.preventDefault()">
      <div class="w-full flex justify-center">
        <div class="flex flex-col gap-3 w-60">
          <div *ngFor="let opcao of opcoes" class="flex items-center gap-2">
            <input class="form-check-input" type="radio" name="motivo" [value]="opcao.value"
              [(ngModel)]="motivoSelecionado" />
            <label class="text-gray-700 font-medium">{{ opcao.label }}</label>
          </div>
        </div>
      </div>

      <textarea *ngIf="motivoSelecionado === 'OUTRO'" [(ngModel)]="outroMotivo" name="outroMotivo"
        class="form-control mt-2 w-full h-24 resize-none rounded shadow-sm border px-3 py-2 placeholder:text-gray-400"
        placeholder="Descreva o motivo." maxlength="100"></textarea>

      <div class="flex justify-center mt-2">
        <button type="button" class="bg-primary text-white font-semibold px-4 py-2 rounded-md hover:bg-[#e68f32] mx-2"
          (click)="onSalvar()">
          Salvar
        </button>

        <button type="button"
          class="bg-yellow-400 text-gray-600 font-semibold px-4 py-2 rounded-md hover:bg-yellow-500 mx-2"
          (click)="fechaModal()">
          Cancelar
        </button>
      </div>
    </form>
  </div>
</div>
