<div class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-end pb-10 z-50">
  <div class="bg-white p-6 rounded-lg shadow-lg w-full max-w-lg">
    <h2 class="text-xl font-semibold mb-4">{{ produtoEditando ? 'Editar Produto' : 'Novo Produto' }}</h2>

    <form [formGroup]="produtoForm" (ngSubmit)="salvar()" class="grid gap-4">
      <app-input formControlName="nome" label="Nome" placeholder="Nome do produto *" [required]="true" />

      <app-input formControlName="descricao" label="Descrição" placeholder="Descrição *" [required]="true" />

      <div class="flex gap-2">
        <app-input type="number" formControlName="altura" label="Altura" placeholder="Altura (cm)" class="w-1/2" />
        <app-input type="number" formControlName="largura" label="Largura" placeholder="Largura (cm)" class="w-1/2" />
      </div>

      <div class="flex gap-2">
        <app-input type="number" formControlName="comprimento" label="Comprimento" placeholder="Comprimento (cm)" class="w-1/2" />
        <app-input type="number" formControlName="pesoSuportado" label="Peso Suportado (kg)" placeholder="Peso Suportado (kg)" class="w-1/2"/>
      </div>

      <div class="flex gap-2">
        <app-input type="number" formControlName="estoque" label="Estoque *" [required]="true" class="w-1/2" />
        <app-input type="number" formControlName="preco" label="Preço *" [required]="true" class="w-1/2" />
      </div>

      <div class="grid gap-2 items-start">
        <label class="font-semibold text-sm">Imagens (máx. 5) *</label>
        <div class="flex gap-2 w-full">
          <div *ngIf="imagensExistentes.length > 0" class="flex gap-2">
            <div *ngFor="let imagem of imagensExistentes; let i = index" class="relative w-24 h-24 rounded-lg border overflow-hidden">
              <img [src]="'data:image/jpeg;base64,' + imagem" class="object-cover w-full h-full" />
              <button
                type="button"
                (click)="removerImagemExistente(i)"
                class="absolute top-1 right-1 bg-black bg-opacity-50 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center"
                title="Remover imagem existente"
              >
                ×
              </button>
            </div>
          </div>

          <app-upload-immagens
            [arquivos]="arquivosImagens"
            (onArquivosAlterados)="arquivosImagens = $event"
          ></app-upload-immagens>
        </div>
      </div>

      <div class="flex items-center justify-end gap-3 pt-4">
        <app-button-secondary title="Voltar" (click)="fechar()"></app-button-secondary>
        <app-button-primary title="{{ produtoEditando ? 'Salvar' : 'Registrar' }}"></app-button-primary>
      </div>
    </form>
  </div>
</div>
