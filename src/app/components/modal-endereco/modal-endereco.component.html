<div class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50">
  <div class="bg-white p-6 rounded-lg shadow-lg w-full max-w-lg">
    <h2 class="text-xl font-semibold mb-4">Novo Endereço</h2>
    <form [formGroup]="enderecoForm" (ngSubmit)="salvar()" class="grid gap-3">
      <div class="flex gap-2 w-full">
        <app-input formControlName="nome" id="nome" name="nome" label="Nome do endereço *" placeholder="Casa, festa da Nina... *"
          [required]="true" [maxlength]="100" for="nome" class="w-2/3"/>

        <app-input formControlName="cep" id="cep" name="cep" label="CEP *" for="cep" class="w-1/3" [required]="true" [maxlength]="9" [numericOnly]="true" (blur)="buscarEnderecoPorCep()"/>
      </div>

      <app-input formControlName="rua" id="rua" name="rua" label="Logradouro *" placeholder="Rua Alegria, Travessa dos Amigos..." for="rua"
        [required]="true" [maxlength]="200" />

      <div class="flex gap-2 w-full">
        <app-input formControlName="numero" id="numero" name="numero" [maxlength]="10" [label]="enderecoForm.get('semNumero')?.value ? 'n°' : 'n° *'" for="numero"
         class="w-1/3" />

        <div class="flex items-center">
          <input type="checkbox" formControlName="semNumero" name="semNumero" class="h-5 w-5 cursor-pointer" />

          <label class="text-xs md:text-sm lg:text-base ml-2">
            S/N
          </label>
        </div>
      </div>

      <div class="flex gap-2 w-full">
        <app-input formControlName="complemento" id="complemento" name="complemento" [label]="enderecoForm.get('semNumero')?.value ? 'Complemento *' : 'Complemento'"
          placeholder="casa amarela, apto 201 bl 37" for="complemento" [maxlength]="200"
          class="w-1/2" />

        <app-input formControlName="bairro" id="bairro" name="bairro" label="Bairro *" for="bairro"
          [required]="true" [maxlength]="50" class="w-1/2" />
      </div>

      <div class="flex gap-2 w-full">
        <app-input formControlName="cidade" id="cidade" name="cidade" label="Cidade *" for="cidade"
          [required]="true" [maxlength]="50" class="w-3/4" />

          <div class="w-1/4">
            <label for="estado" class="flex text-base justify-start ml-2">Estado *</label>
            <select
              formControlName="estado"
              class="h-11 w-full border-[2px] rounded-lg border-[#E7E3E3] text-sm lg:text-base font-primary font-semibold text-black focus:outline-none px-3 bg placeholder-[#C6C2C2]"
            >
              <option *ngFor="let estado of estados" [value]="estado">{{ estado }}</option>
            </select>
            <div *ngIf="enderecoForm.get('estado')?.invalid && enderecoForm.get('estado')?.touched" class="text-red-500 text-xs mt-1">
              Este campo é obrigatório
            </div>
          </div>
      </div>

      <div class="flex items-center justify-end gap-3 pt-4">
        <app-button-secondary title="Voltar" (click)="fechar()"></app-button-secondary>
        <app-button-primary title="{{ enderecoEditando ? 'Salvar' : 'Registrar' }}"></app-button-primary>
      </div>
    </form>
  </div>
</div>
