<div class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-end pb-10 z-50">
  <div class="bg-white p-6 rounded-lg shadow-lg w-full max-w-lg">
    <h4 class="text-base">Informe o CEP para preenchimento automático</h4>
    <a href="https://buscacepinter.correios.com.br/app/endereco/index.php?t"
      class="text-sm italic underline text-primary" target="_blank" rel="noopener noreferrer">Não sabe seu CEP? Busque
      aqui.</a>
    <form [formGroup]="enderecoForm" (ngSubmit)="salvar()" class="grid gap-3 mt-4">
      <div class="flex gap-2 w-full">
        <app-input formControlName="nome" id="nome" name="nome" label="Nome do endereço *"
          placeholder="Casa, festa da Nina... *" [required]="true" [maxlength]="100" for="nome" class="w-2/3"
          [invalid]="enderecoForm.get('nome')?.invalid && enderecoForm.get('nome')?.touched" />

        <app-input formControlName="cep" id="cep" name="cep" label="CEP *" for="cep" class="w-1/3" [required]="true"
          [maxlength]="9" [numericOnly]="true"
          [invalid]="enderecoForm.get('cep')?.invalid && enderecoForm.get('cep')?.touched"
          (blur)="buscarEnderecoPorCep()" />
      </div>

      <app-input formControlName="rua" id="rua" name="rua" label="Logradouro *"
        placeholder="Rua Alegria, Travessa dos Amigos..." for="rua" [required]="true" [maxlength]="200"
        [invalid]="enderecoForm.get('rua')?.invalid && enderecoForm.get('rua')?.touched" />

      <div class="flex gap-2 w-full items-end">
        <app-input formControlName="numero" id="numero" name="numero" [maxlength]="10"
          [label]="enderecoForm.get('semNumero')?.value ? 'n°' : 'n° *'" for="numero"
          [invalid]="enderecoForm.get('numero')?.invalid && enderecoForm.get('numero')?.touched"
          [required]="!enderecoForm.get('semNumero')?.value" class="w-1/3" />

        <div class="flex items-center mb-3">
          <input type="checkbox" formControlName="semNumero" name="semNumero" class="h-5 w-5 cursor-pointer" />

          <label class="text-xs md:text-sm lg:text-base ml-2">
            S/N
          </label>
        </div>
      </div>

      <div class="flex gap-2 w-full">
        <app-input formControlName="complemento" id="complemento" name="complemento"
          [label]="enderecoForm.get('semNumero')?.value ? 'Complemento *' : 'Complemento'"
          placeholder="casa amarela, apto 201 bl 37" for="complemento" [maxlength]="200"
          [invalid]="enderecoForm.get('complemento')?.invalid" [required]="enderecoForm.get('semNumero')?.value"
          class="w-1/2" />

        <app-input formControlName="bairro" id="bairro" name="bairro" label="Bairro *" for="bairro" [required]="true"
          [maxlength]="50" [invalid]="enderecoForm.get('bairro')?.invalid && enderecoForm.get('bairro')?.touched"
          class="w-1/2" />
      </div>

      <div class="flex gap-2 w-full">
        <app-input formControlName="cidade" id="cidade" name="cidade" label="Cidade *" for="cidade" [required]="true"
          [maxlength]="50" class="w-3/4" />

        <app-input formControlName="estado" id="estado" name="estado" label="Estado *" for="estado" [required]="true"
          class="w-1/4" />
      </div>

      <div class="flex items-center justify-end gap-3 pt-4">
        <app-button-secondary title="Voltar" (click)="fechar()"></app-button-secondary>
        <app-button-primary title="{{ enderecoEditando ? 'Salvar' : 'Registrar' }}"></app-button-primary>
      </div>
    </form>
  </div>
</div>
