<div class="w-full">
  <label
    [for]="for"
    class="flex text-base justify-start ml-2"
  >{{ label }}</label>
  <input
    [id]="id"
    [type]="type"
    [(ngModel)]="value"
    (input)="onInput($event)"
    (blur)="markAsTouched()"
    [disabled]="disabled"
    [placeholder]="placeholder"
    [name]="name"
    [required]="required"
    [mask]="mask"
    [attr.maxlength]="maxlength ?? null"
    [attr.inputmode]="numericOnly ? 'numeric' : null"
    [ngClass]="{
      'h-11 w-full border-[2px] rounded-lg placeholder-[#C6C2C2] placeholder:text-sm placeholder:font-primary placeholder:font-semibold text-black focus:outline-none px-3':
        true,
      'border-red-500 focus:ring-red-300 focus:border-red-500': invalid,
      'border-[#E7E3E3] focus:ring-1 focus:ring-[#D98027] focus:border-[#D98027]': !invalid,
      'bg-[#e6e6e6]': disabled,
      'bg-white': !disabled
    }" />
  <div *ngIf="invalid && required" class="flex text-red-500 text-xs mt-1 items-start ml-2">
    Este campo é obrigatório
  </div>

  <div *ngIf="showCustomError && customErrorMsg" class="flex text-red-500 text-xs mt-1 items-start ml-2">
    {{ customErrorMsg }}
  </div>
</div>
