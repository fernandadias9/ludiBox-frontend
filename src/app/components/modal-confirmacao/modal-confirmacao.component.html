<div class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 z-50">
    <div class="bg-white rounded-lg shadow-lg p-6 w-80">
      <h2 class="text-lg font-semibold mb-4">{{ titulo }}</h2>
      <p class="mb-6">{{ mensagem }}</p>
  
      <div class="flex justify-end gap-3">
        <button (click)="cancelar()"
          class="px-4 py-2 rounded bg-gray-300 hover:bg-gray-400">Cancelar</button>
        <button (click)="confirmar()"
          class="px-4 py-2 rounded bg-primary text-white hover:bg-orangeHover">Confirmar</button>
      </div>
    </div>
  </div>
