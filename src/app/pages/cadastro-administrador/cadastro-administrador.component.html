<app-template-telas-adm>
      <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-2xl">
        <h2 class="text-2xl font-semibold text-center mb-6">Cadastro de novo Administrador</h2>
        <form>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium mb-1">Nome *</label>
              <app-input placeholder="Nome" type="text" class="form-control"></app-input>
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">CPF *</label>
              <app-input type="text" class="form-control" placeholder="CPF"></app-input>
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">E-mail *</label>
              <app-input type="email" class="form-control" placeholder="E-mail"></app-input>
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">Telefone *</label>
              <app-input type="tel" class="form-control" placeholder="Telefone"></app-input>
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">Senha *</label>
              <app-input type="password" class="form-control" placeholder="Senha"></app-input>
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">Confirmar Senha *</label>
              <app-input type="password" class="form-control" placeholder="Confirmar Senha"></app-input>
            </div>
          </div>
          <div class="flex justify-end mt-6 space-x-4">
            <button type="button" class="px-4 py-2 bg-primary text-white rounded-md"><strong>Voltar</strong></button>
            <button type="submit" class="px-4 py-2 bg-secondary text-black rounded-md"><strong>Cadastrar</strong></button>
          </div>
        </form>
      </div>
  </app-template-telas-adm>
