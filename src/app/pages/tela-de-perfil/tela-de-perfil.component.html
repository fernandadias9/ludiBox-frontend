<main class="relative w-screen h-screen overflow-hidden">
  <app-sidebar [menuItems]="menu"></app-sidebar>
  
    <div class="w-full h-24 bg-primary flex items-center justify-between px-5 lg:px-10 shadow-md fixed top-0 left-0 z-50">
      <img src="/images/logo.png" alt="Logomarca LudiBox" class="w-40 h-auto pt-2">
    </div>
  
    <div class="flex flex-col items-center justify-center min-h-screen bg-gray-100 transition-all duration-300 pt-28 p-4">
      <div class="bg-white p-4 rounded-lg shadow-lg w-full lg:w-4/5 max-w-4xl text-center">
        <div class="flex items-center justify-between gap-4 top-0 pb-6">
          <div class="flex items-center gap-4">
            <img src="images/shrek_colombiano.png" 
              alt="Foto" 
              class="w-20 h-20 rounded-full ml-0 border-4 border-primary object-contain">
            <label class="text-2xl font-semibold">Informações da conta</label>
          </div>
    
          <div class="relative">
            <i (click)="isOpen = !isOpen" class="text-3xl bi bi-list cursor-pointer text-xl hover:text-gray-600"></i>

    
            <div *ngIf="isOpen" class="absolute right-0 mt-2 w-auto bg-white border rounded-lg shadow-lg z-10">
              <div class="flex items-center gap-2 p-2 hover:bg-gray-100 cursor-pointer" routerLink="login">
                <p class="text-base md:text-lg">Editar</p>
              </div>
              <div class="flex items-center gap-2 p-2 hover:bg-gray-100 cursor-pointer" routerLink="cadastro">
                <p class="text-base md:text-lg">Desativar</p>
              </div>
              <div class="flex items-center gap-2 p-2 hover:bg-gray-100 cursor-pointer" routerLink="cadastro">
                <p class="text-base md:text-lg text-red-500"><strong>Excluir</strong></p>
              </div>
            </div>
          </div>
        </div>
  

        <form class="grid gap-4 w-full">
            <div class="grid w-full text-left">
              <label class="text-lg font-semibold">Nome</label>
              <app-input id="name" name="name" label="Nome Completo"
                placeholder="{{ 'Shrek Colombiano' }}" class="input-field w-full "></app-input>
            </div>
            <div class="grid w-full text-left">
              <label class="text-lg font-semibold">Email</label>
              <app-input id="email" name="email" label="Email"
                placeholder="{{ 'ShrekColombiano@gmail.com' }}" class="input-field w-full"></app-input>
            </div>

          <div class="grid w-full text-left">
            <label class="text-lg font-semibold">Documento</label>
            <app-input id="cpf" name="cpf" label="CPF"
              placeholder="{{ '000.000.000-00' }}" class="input-field w-full "></app-input>
          </div>
          <div class="grid w-full text-left">
            <label class="text-lg font-semibold">Telefone</label>
            <app-input id="phone" name="phone" label="Telefone"
              placeholder="{{ '+55 (48) 99176-2810' }}" class="input-field w-full "></app-input>
          </div>
          <div class="grid w-full text-left">
            <label class="text-lg font-semibold">Senha</label>
            <app-input id="password" name="password" label="Senha"
              placeholder="{{ 'senha' }}" class="input-field w-full "></app-input>
          </div>
        </form>

      
        
      </div>
    </div>
    
    
      
  </main>
