<app-sidebar [withOverflow]="true" [menuItems]="menuList">
  <router-outlet></router-outlet>
  <div class="flex justify-center items-start min-h-screen mt-5">
    <div class="bg-white p-4 rounded-lg shadow-lg w-full lg:w-4/5 max-w-4xl text-center">
      <div class="flex items-center justify-between gap-4 top-0 pb-6">
        <div class="flex items-center gap-4">
          <img src="images/shrek_colombiano.png" 
            alt="Foto" 
            class="w-20 h-20 rounded-full ml-0 border-4 border-primary object-contain">
          <label class="text-2xl font-semibold">Informações da conta</label>
        </div>
        
        <div class="relative">

          <app-modal-alterar-senha 
            [hidden]="!isModalOpen" 
            (onClose)="fecharModal()" 
            (onSenhaAlterada)="onSenhaAlterada()">
          </app-modal-alterar-senha>

          <i (click)="isOpen = !isOpen" class="text-3xl bi bi-list cursor-pointer text-xl hover:text-gray-600"></i>
          <div *ngIf="isOpen" class="absolute right-0 mt-2 w-auto bg-white border rounded-lg shadow-lg z-10">
            <div class="flex items-center gap-2 p-2 hover:bg-gray-100 cursor-pointer" (click)="toggleEdit()" >
              <p class="text-base md:text-lg">Editar</p>
            </div>
            <div class="flex items-center gap-2 p-2 hover:bg-gray-100 cursor-pointer" routerLink="cadastro">
              <p class="text-base md:text-lg text-red-500"><strong>Excluir</strong></p>
            </div>
          </div>
        </div>
      </div>

      <form [formGroup]="perfilForm" (ngSubmit)="salvarPerfil()" class="grid gap-4 w-full" *ngIf="perfil?.id">
        <div class="grid w-full text-left">
          <label class="text-lg font-semibold">
            {{ isEditing ? 'Nome*' : 'Nome' }}
          </label>
          <app-input 
            formControlName="nome" 
            [(value)]="perfil.nome"
            id="name" name="name" label="Nome Completo" 
            [(ngModel)]="perfil.nome"
            [disabled]="!isEditing"
            placeholder="Nome Sobrenome"
            [required]="true"
            [invalid]="isFieldInvalid('nome')"
            class="input-field w-full">
          </app-input>
        </div>
        <div class="grid w-full text-left">
          <label class="text-lg font-semibold">
            {{ isEditing ? 'Email*' : 'Email' }}
          </label>
          <app-input
          formControlName="email" 
          id="email" name="email" label="Email" 
          [(ngModel)]="perfil.email"
          [(value)]="perfil.email"
          [disabled]="!isEditing"
          placeholder="@exemplo.com"
          [required]="true"
          [invalid]="isFieldInvalid('email')"
          class="input-field w-full"></app-input>
        </div>
        <div class="grid w-full text-left">
          <label class="text-lg font-semibold">CPF/CNPJ</label>
          <app-input 
            id="cpf" name="cpf" label="CPF"  
            [value]="perfil?.valorDocumento" 
            [disabled]="true"
            placeholder="{{ perfil?.valorDocumento }}" 
            mask="000.000.000-00"
            class="input-field w-full">
          </app-input>
        </div>
        <div class="grid w-full text-left">
          <label class="text-lg font-semibold">
            {{ isEditing ? 'Telefone*' : 'Telefone' }}
          </label>
          <app-input 
            formControlName="telefone"
            id="phone" name="phone" label="Telefone"  
            [disabled]="!isEditing"
            mask="(00) 0000-0000"
            placeholder="(00) 0000-0000"
            [required]="true"
            [invalid]="isFieldInvalid('telefone')"
            class="input-field w-full">
          </app-input>
        </div>
      </form>
      <div class="mt-9 flex justify-between items-center w-full">
        
        <button 
        class="px-4 py-2 bg-primary text-white rounded-lg enabled:hover:bg-orangeHover enabled:active:bg-orangeActive transition-colors duration-300 disabled:opacity-50 disabled:cursor-not-allowed"
          (click)="abrirModal()">
          Editar senha
        </button>
      
        <div class="flex gap-4">
          <button 
          class="px-4 py-2 bg-primary text-white rounded-lg enabled:hover:bg-orangeHover enabled:active:bg-orangeActive transition-colors duration-300 disabled:opacity-50 disabled:cursor-not-allowed"
            [disabled]="!isEditing"
            (click)="toggleEdit()">
            Cancelar
          </button>
          <button 
          class="px-4 py-2 bg-primary text-white rounded-lg enabled:hover:bg-orangeHover enabled:active:bg-orangeActive transition-colors duration-300 disabled:opacity-50 disabled:cursor-not-allowed"
            [disabled]="!isEditing"
            (click)="salvarPerfil()">
            Salvar
          </button>
        </div>
      </div>
      


    </div>
  </div>
</app-sidebar>
