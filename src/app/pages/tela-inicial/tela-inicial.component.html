<app-template-anuncios (searchTermChange)="onSearch($event)">
  <div class="flex flex-wrap justify-center gap-9 p-6 w-full h-full">
    <ng-container *ngFor="let anuncio of anuncios">
      <app-card-anuncios [id]="anuncio.id" [imagem]="anuncio.imagem" [itemName]="anuncio.nome" [itemPrice]="anuncio.preco" [userName]="anuncio.nomeAnunciante"></app-card-anuncios>
    </ng-container>
  </div>
</app-template-anuncios>
